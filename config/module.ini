[info]
name         = "TwoFactorTotp"
description  = "Two-factor authentication with a time-based one-time password (TOTP, RFC 6238) from an authenticator app such as Google Authenticator, Aegis, 1Password or Bitwarden, or a passkey (WebAuthn) such as a hardware key, Touch ID or Windows Hello. Includes single-use recovery codes and optional trusted devices."
tags         = "security, authentication, 2fa, totp, webauthn, passkeys, users"
license      = "GPL-3.0"
author       = "Bob Coret"
author_link  = "https://www.coret.org"
module_link  = "https://github.com/coret/Omeka-S-module-TwoFactorTotp"
support_link = "https://github.com/coret/Omeka-S-module-TwoFactorTotp/issues"
configurable = true
version      = "0.2"
omeka_version_constraint = "^4.0.0"
