[info]
name         = "TwoFactorTotp"
description  = "Two-factor authentication with time-based one-time passwords (TOTP, RFC 6238) from an authenticator app such as Google Authenticator, Aegis, 1Password or Bitwarden."
tags         = "security, authentication, 2fa, totp, users"
license      = "GPL-3.0"
author       = "Bob Coret"
author_link  = "https://www.coret.org"
module_link  = "https://github.com/coret/Omeka-S-module-TwoFactorTotp"
support_link = "https://github.com/coret/Omeka-S-module-TwoFactorTotp/issues"
configurable = true
version      = "0.2"
omeka_version_constraint = "^4.0.0"
